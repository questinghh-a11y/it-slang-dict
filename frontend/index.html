<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Словарь ИТ-сленга</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">&lt;/&gt;</span>
    <div>
      <h1>Словарь ИТ-сленга</h1>
      <p class="subtitle">Говори как разработчик</p>
    </div>
  </div>

  <div class="controls">
    <input id="search" type="search" placeholder="Поиск термина…" autocomplete="off">
    <button id="randomBtn" class="btn ghost" title="Случайный термин">🎲</button>
    <button id="addBtn" class="btn primary hidden">+ Добавить</button>
    <button id="logsBtn" class="btn ghost hidden">Журнал</button>
    <button id="usersBtn" class="btn ghost hidden">Люди</button>
    <button id="loginBtn" class="btn ghost">Войти</button>
    <button id="logoutBtn" class="btn ghost hidden">Выйти</button>
    <span id="userBadge" class="badge admin hidden"></span>
  </div>
</header>

<nav id="categories" class="categories"></nav>

<main>
  <div id="status" class="status"></div>
  <section id="grid" class="grid"></section>
</main>

<!-- Просмотр термина -->
<div id="viewModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <span class="badge" id="viewCategory"></span>
    <h2 id="viewTerm"></h2>
    <p id="viewDefinition" class="definition"></p>
    <div id="viewExampleWrap" class="example-wrap">
      <span class="label">Пример:</span>
      <p id="viewExample"></p>
    </div>
    <p class="meta" id="viewMeta"></p>
  </div>
</div>

<!-- Форма термина -->
<div id="formModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <h2 id="formTitle">Новый термин</h2>
    <form id="termForm">
      <label>Термин *<input name="term" required maxlength="200"></label>
      <label>Категория *
        <input name="category" required list="catList" maxlength="80">
        <datalist id="catList"></datalist>
      </label>
      <label>Определение *
        <textarea name="definition" required rows="4"></textarea>
      </label>
      <label>Пример
        <textarea name="example" rows="2"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Отмена</button>
        <button type="submit" class="btn primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- Вход -->
<div id="loginModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <h2>Вход</h2>
    <form id="loginForm">
      <label>Имя пользователя<input name="username" required autocomplete="username"></label>
      <label>Пароль<input type="password" name="password" required autocomplete="current-password"></label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Отмена</button>
        <button type="submit" class="btn primary">Войти</button>
      </div>
    </form>
    <p class="hint">Нет аккаунта? <a href="#" id="toRegister">Зарегистрироваться</a></p>
  </div>
</div>

<!-- Регистрация -->
<div id="registerModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <h2>Регистрация</h2>
    <form id="registerForm">
      <label>Имя пользователя (мин. 3 символа)<input name="username" required minlength="3" maxlength="50"></label>
      <label>Пароль (мин. 6 символов)<input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Отмена</button>
        <button type="submit" class="btn primary">Создать аккаунт</button>
      </div>
    </form>
    <p class="hint">Уже есть аккаунт? <a href="#" id="toLogin">Войти</a></p>
  </div>
</div>

<!-- Журнал правок -->
<div id="logsModal" class="modal hidden">
  <div class="modal-card wide">
    <button class="close" data-close>&times;</button>
    <h2>Журнал правок</h2>
    <div id="logsList" class="logs-list"></div>
  </div>
</div>

<!-- Пользователи -->
<div id="usersModal" class="modal hidden">
  <div class="modal-card wide">
    <button class="close" data-close>&times;</button>
    <h2>Пользователи</h2>
    <div id="usersList" class="users-list"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
