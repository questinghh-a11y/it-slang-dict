<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Словарь ИТ-сленга</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="bg-mesh">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="bg-grid"></div>

<header class="topbar">
  <div class="brand">
    <span class="logo">&lt;/&gt;</span>
    <div>
      <h1>Словарь ИТ-сленга</h1>
      <p class="subtitle">Говори как разработчик</p>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="search" type="search" placeholder="Поиск термина…" autocomplete="off">
    </div>
    <button id="randomBtn" class="btn ghost" title="Случайный термин">🎲</button>
    <button id="addBtn" class="btn primary hidden">+ Добавить</button>
    <button id="logsBtn" class="btn ghost hidden">Журнал</button>
    <button id="usersBtn" class="btn ghost hidden">Люди</button>
    <button id="loginBtn" class="btn ghost">Войти</button>
    <button id="logoutBtn" class="btn ghost hidden">Выйти</button>
    <button id="profileBtn" class="badge admin hidden"></button>
  </div>
</header>

<main>
  <div id="status" class="status"></div>

  <!-- Экран разделов -->
  <section id="categoriesView" class="categories-view">
    <div class="section-head">
      <h2>Разделы словаря</h2>
      <p>Выбери раздел, чтобы посмотреть термины</p>
    </div>
    <div id="categoriesGrid" class="categories-grid"></div>
  </section>

  <!-- Экран терминов -->
  <section id="termsView" class="terms-view hidden">
    <div class="terms-head">
      <button id="backToCategoriesBtn" class="btn ghost">← Все разделы</button>
      <h2 id="termsHeadTitle"></h2>
      <span id="termsHeadCount" class="count"></span>
    </div>
    <section id="grid" class="grid"></section>
  </section>
</main>

<!-- Просмотр термина -->
<div id="viewModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <span class="badge" id="viewCategory"></span>
    <h2 id="viewTerm"></h2>
    <p id="viewDefinition" class="definition"></p>
    <div id="viewExampleWrap" class="example-wrap">
      <span class="label">Пример:</span>
      <p id="viewExample"></p>
    </div>
    <p class="meta" id="viewMeta"></p>
  </div>
</div>

<!-- Форма термина -->
<div id="formModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <h2 id="formTitle">Новый термин</h2>
    <form id="termForm">
      <label>Термин *<input name="term" required maxlength="200"></label>
      <label>Категория *
        <input name="category" required list="catList" maxlength="80">
        <datalist id="catList"></datalist>
      </label>
      <label>Определение *
        <textarea name="definition" required rows="4"></textarea>
      </label>
      <label>Пример
        <textarea name="example" rows="2"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Отмена</button>
        <button type="submit" class="btn primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- Вход -->
<div id="loginModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <h2>Вход</h2>
    <form id="loginForm">
      <label>Имя пользователя<input name="username" required autocomplete="username"></label>
      <label>Пароль<input type="password" name="password" required autocomplete="current-password"></label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Отмена</button>
        <button type="submit" class="btn primary">Войти</button>
      </div>
    </form>
    <p class="hint">Нет аккаунта? <a href="#" id="toRegister">Зарегистрироваться</a></p>
  </div>
</div>

<!-- Регистрация -->
<div id="registerModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <h2>Регистрация</h2>
    <form id="registerForm">
      <label>Имя пользователя (мин. 3 символа)<input name="username" required minlength="3" maxlength="50"></label>
      <label>Пароль (мин. 6 символов)<input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
      <label>Email<input type="email" name="email" placeholder="you@example.com"></label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Отмена</button>
        <button type="submit" class="btn primary">Создать аккаунт</button>
      </div>
    </form>
    <p class="hint">Уже есть аккаунт? <a href="#" id="toLogin">Войти</a></p>
  </div>
</div>

<!-- Журнал -->
<div id="logsModal" class="modal hidden">
  <div class="modal-card wide">
    <button class="close" data-close>&times;</button>
    <h2>Журнал</h2>

    <div class="log-filters">
      <input id="logFilterUser" type="text" placeholder="Пользователь" autocomplete="off">
      <select id="logFilterAction">
        <option value="">Все действия</option>
      </select>
      <input id="logFilterFrom" type="date" title="С даты">
      <input id="logFilterTo" type="date" title="По дату">
      <button id="logApplyBtn" class="btn primary">Применить</button>
      <button id="logResetBtn" class="btn ghost">Сбросить</button>
      <button id="logExportBtn" class="btn ghost" title="Скачать CSV">⬇ CSV</button>
    </div>

    <div id="logTotal" class="log-total"></div>
    <div id="logsList" class="logs-list"></div>
    <button id="logMoreBtn" class="btn ghost hidden">Показать ещё 50</button>
  </div>
</div>

<!-- Пользователи -->
<div id="usersModal" class="modal hidden">
  <div class="modal-card wide">
    <button class="close" data-close>&times;</button>
    <h2>Пользователи</h2>
    <div id="usersList" class="users-list"></div>
  </div>
</div>

<!-- Профиль -->
<div id="profileModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <h2>Профиль</h2>
    <form id="profileForm">
      <label>Имя пользователя<input name="username" disabled></label>
      <label>Email<input type="email" name="email" placeholder="you@example.com"></label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Отмена</button>
        <button type="submit" class="btn primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
